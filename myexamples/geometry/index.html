<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSXGraph Geometry</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    
    <!-- JSXGraph CSS and JS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.5.0/distrib/jsxgraph.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.5.0/distrib/jsxgraphcore.js"></script>
    
    <!-- Touch Events Support -->
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <button id="menuToggle" class="icon-button">
                <img src="icons/menu.svg" alt="Menu">
            </button>
            <h1>Geometry</h1>
        </div>
        <div class="nav-right">
            <button class="icon-button">
                <img src="icons/share.svg" alt="Share">
            </button>
            <button class="icon-button">
                <img src="icons/assignment.svg" alt="Assignment">
            </button>
            <button class="icon-button">
                <img src="icons/signin.svg" alt="Sign In">
            </button>
        </div>
    </nav>

    <div class="main-container">
        <!-- Left Sidebar -->
        <div id="sidebar" class="sidebar">
            <div class="tools-wrapper">
                <div class="tools-header">
                    <h2>Tools</h2>
                    <button id="collapseTools" class="icon-button">
                        <img src="icons/collapse.svg" alt="Collapse">
                    </button>
                </div>
                <div class="tools-container">
                    <!-- Tool categories and buttons will be populated dynamically -->
                </div>
            </div>
            <div class="algebra-wrapper hidden">
                <div class="algebra-header">
                    <h2>Algebra</h2>
                </div>
                <div id="algebraView" class="algebra-container">
                    <!-- Algebra view content will be populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-container">
            <div id="jxgbox" class="jxgbox"></div>
            

        </div>

        <!-- Right Utility Buttons -->
        <div class="utility-buttons">
            <button class="icon-button" id="homeView">
                <img src="icons/home.svg" alt="Home view">
            </button>
            <button class="icon-button" id="zoomIn">
                <img src="icons/zoom_in.svg" alt="Zoom in">
            </button>
            <button class="icon-button" id="zoomOut">
                <img src="icons/zoom_out.svg" alt="Zoom out">
            </button>
            <button class="icon-button" id="fullscreen">
                <img src="icons/fullscreen.svg" alt="Fullscreen">
            </button>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="js/config.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/board.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
